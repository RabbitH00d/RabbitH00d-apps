<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pense-bête</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#e39a00" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2e2810" media="(prefers-color-scheme: dark)">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: rapide, sans friction, un bloc-notes qu'on dégaine en une seconde
   IDEA: un bloc de notes adhésives jaunes — on griffonne, on arrache, on oublie
   PICTURE: la bande jaune de saisie elle-même, géante, puis la pile de notes
   COLOUR and TYPE: ambre #e39a00 dominant (couleur de l'icône), encre presque noire, rouge tomate pour l'urgent ; Sofia Sans Condensed 800 + Instrument Sans (style commun Rabbit's Apps)
   LAYOUT: une colonne de 720px max, saisie en haut, filtres, liste ; tout tient sur un téléphone */
:root{color-scheme:light dark;
--bg:light-dark(#faf8f1,#13120d);--ink:light-dark(#1b1a14,#f3efdf);--mute:light-dark(#6d6a5c,#a39f8b);
--pad:light-dark(#e39a00,#2e2810);--padink:light-dark(#1b1a14,#ffe27a);--padline:light-dark(#cf8c00,#4a4016);
--card:light-dark(#ffffff,#1c1b15);--line:light-dark(#e7e3d4,#2c2a21);--hot:light-dark(#d9411e,#ff7652);--ok:light-dark(#2f7d4f,#6fcf95)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:clip}
.pad{background:var(--pad);color:var(--padink);padding:clamp(22px,4vw,44px) max(5vw,16px) 28px;
 background-image:repeating-linear-gradient(transparent 0 43px,var(--padline) 43px 44px);background-position:0 18px}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.back{color:var(--padink);font-size:14px;opacity:.8;text-decoration:none;white-space:nowrap}
.back:hover{text-decoration:underline}
h1{font:800 clamp(34px,6vw,52px)/1.05 "Sofia Sans Condensed",system-ui,sans-serif;margin:0 0 4px}
.sub{margin:0 0 18px;font-size:15px;opacity:.8}
form{display:flex;gap:8px;align-items:stretch}
#q{flex:1;font:500 clamp(18px,3vw,21px)/1.3 "Instrument Sans",system-ui,sans-serif;padding:14px 16px;border:2px solid var(--padink);border-radius:12px;
 background:light-dark(#fffbe6,#1b180b);color:var(--ink);outline:none;box-shadow:4px 4px 0 var(--padink)}
#q:focus{box-shadow:2px 2px 0 var(--padink);transform:translate(2px,2px)}
.btn{min-width:52px;min-height:52px;border:2px solid var(--padink);border-radius:12px;background:var(--padink);color:var(--pad);
 font:600 15px "Instrument Sans",sans-serif;cursor:pointer;display:grid;place-items:center;padding:0 14px}
.btn:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
#mic{background:transparent;color:var(--padink)}#mic[hidden]{display:none}
#mic.on{background:var(--hot);border-color:var(--hot);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--hot) 30%,transparent)}}
.hint{margin:12px 0 0;font-size:13px;opacity:.75}
.hint kbd{font:600 12px "Instrument Sans",system-ui,sans-serif;border:1px solid currentColor;border-radius:4px;padding:0 4px}
main{padding:20px max(5vw,16px) 80px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:10px;padding:3px}
.tabs button,.chip{border:0;background:transparent;color:var(--ink);font:500 14px "Instrument Sans",system-ui,sans-serif;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:38px}
.tabs button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 2px #0002}
#find{flex:1;min-width:140px;font:16px "Instrument Sans",system-ui,sans-serif;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:42px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);padding:4px 10px;min-height:32px;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;align-items:flex-start;padding:12px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
li.hot{border-left:5px solid var(--hot)}
li.done .txt{text-decoration:line-through;color:var(--mute)}
.ck{appearance:none;flex:none;width:26px;height:26px;margin:1px 0 0;border:2px solid var(--ink);border-radius:7px;cursor:pointer;display:grid;place-items:center}
.ck:checked{background:var(--ok);border-color:var(--ok)}
.ck:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1}
.txt{font:500 18px/1.35 "Instrument Sans",system-ui,sans-serif;overflow-wrap:anywhere;cursor:text;white-space:pre-wrap}
.txt input{width:100%;font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:13px;color:var(--mute)}
.tag{background:var(--pad);color:var(--padink);border-radius:5px;padding:0 6px;font-weight:600}
.del,.star{flex:none;width:36px;height:36px;border:0;background:transparent;color:var(--mute);border-radius:8px;cursor:pointer;font-size:18px}
.del:hover,.star:hover{background:var(--line);color:var(--ink)}
.star.on{color:var(--hot)}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.empty b{display:block;font:800 26px "Sofia Sans Condensed",system-ui,sans-serif;color:var(--ink);margin-bottom:4px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:13px;color:var(--mute)}
.foot span.links{display:flex;gap:16px}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;padding:6px 0}
#sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}
#sync.ok::before{background:var(--ok)}#sync.warn::before{background:var(--hot)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;transition:transform .2s;max-width:calc(100vw - 32px);z-index:5}
#toast.show{transform:translate(-50%,0)}
#toast button{background:var(--pad);color:var(--padink);border:0;border-radius:8px;padding:8px 12px;font:600 14px "Instrument Sans",system-ui,sans-serif;cursor:pointer;min-height:38px}
#auth{position:fixed;inset:0;z-index:10;background:var(--pad);color:var(--padink);display:grid;place-items:center;padding:24px;
 background-image:repeating-linear-gradient(transparent 0 43px,var(--padline) 43px 44px)}
#auth[hidden]{display:none}
#auth form{flex-direction:column;max-width:420px;width:100%;gap:12px}
#auth h1{display:flex;align-items:center;gap:12px}
#auth p{margin:0 0 6px}
#aMail{font:18px "Instrument Sans",system-ui,sans-serif;padding:14px 16px;border:2px solid var(--padink);border-radius:12px;background:light-dark(#fffbe6,#1b180b);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.hint{display:none}.tabs{width:100%}.tabs button{flex:1}}
</style>
</head>
<body>
<header class="pad">
 <div class="wrap">
  <div class="top"><h1 id="title">Pense-bête</h1><a class="back" href="../">← Rabbit's Apps</a></div>
  <p class="sub" id="count">Note-le avant que ça s'envole.</p>
  <form id="f" autocomplete="off">
   <input id="q" placeholder="Rappeler le garage, acheter des piles…" aria-label="Nouvelle chose à faire" enterkeyhint="done">
   <button type="button" class="btn" id="mic" hidden aria-label="Dicter">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
   </button>
   <button class="btn" type="submit" aria-label="Ajouter">Noter</button>
  </form>
  <p class="hint"><kbd>Entrée</kbd> pour noter · <kbd>!</kbd> = urgent · <kbd>#cours</kbd> = étiquette · <kbd>/</kbd> pour revenir ici de n'importe où</p>
 </div>
</header>
<main class="wrap">
 <div class="bar">
  <div class="tabs" role="group" aria-label="Afficher">
   <button data-v="todo" aria-pressed="true">À faire</button>
   <button data-v="done" aria-pressed="false">Fait</button>
   <button data-v="all" aria-pressed="false">Tout</button>
  </div>
  <input id="find" type="search" placeholder="Chercher…" aria-label="Chercher">
 </div>
 <div class="chips" id="chips"></div>
 <ul id="list"></ul>
 <div class="foot"><span id="sync">Chargement…</span><span class="links"><button class="link" id="purge" type="button">Effacer les tâches faites</button><button class="link" id="logout" type="button">Se déconnecter</button></span></div>
</main>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button">Annuler</button></div>
<div id="auth" hidden><form id="aForm"><h1><img src="icon.svg" alt="" width="44" height="44" style="border-radius:10px">Pense-bête</h1><p id="aMsg">Entre ton adresse e-mail : tu recevras un lien de connexion. Une seule fois par appareil.</p><input id="aMail" type="email" required autocomplete="email" placeholder="ton@email.fr" aria-label="Adresse e-mail"><button class="btn" id="aBtn">Recevoir le lien</button></form></div>
<script>
{
const $=s=>document.querySelector(s);
const q=$('#q'),list=$('#list'),chips=$('#chips'),sync=$('#sync'),find=$('#find');
let items={},view='todo',tagF=null,lastDel=null,toastT=0;
// Cache local + opérations en attente d'envoi (hors ligne) : {id:'put'|'del'}
const LS='pense-bete-v1',LSP='pense-bete-attente';
const readLS=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}};
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(items));localStorage.setItem(LSP,JSON.stringify(pend))}catch(e){}};
items=readLS(LS);let pend=readLS(LSP);

const SB_URL='https://bnjuccoewykxsvsjecfv.supabase.co',SB_KEY='sb_publishable_x-iKFVWL1nXrzswTnJns1w_XgdkjKBs';
let sb=null,signedIn=false,flushing=null;
const toRow=(id,v)=>({id,texte:v.text,urgent:!!v.urgent,tags:v.tags||[],fait:!!v.done,fait_le:v.done&&v.doneAt?new Date(v.doneAt).toISOString():null,created_at:new Date(v.created||Date.now()).toISOString()});
const fromRow=r=>({text:r.texte,urgent:!!r.urgent,tags:r.tags||[],done:!!r.fait,created:Date.parse(r.created_at)||Date.now(),doneAt:r.fait_le?Date.parse(r.fait_le):0});

function parse(raw){
 let t=raw.trim(),urgent=false,tags=[];
 urgent=/(^|\s)!+(?=\s|$)/.test(t)||t.startsWith('!');
 t=t.replace(/(^|\s)!+(?=\s|$)/g,' ').replace(/^!+/,'');
 t=t.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,(m,s,g)=>{tags.push(g.toLowerCase());return s});
 return{text:t.replace(/\s+/g,' ').trim(),urgent,tags:[...new Set(tags)]};
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// Envoie toutes les opérations en attente, une à la fois
function flush(){
 if(!sb||!signedIn)return Promise.resolve();
 if(flushing)return flushing.then(()=>Object.keys(pend).length&&flush());
 flushing=(async()=>{
  let fail=false;
  for(const id of Object.keys(pend)){
   const op=pend[id];
   const r=op==='del'?await sb.from('pense_bete').delete().eq('id',id):items[id]?await sb.from('pense_bete').upsert(toRow(id,items[id])):{error:null};
   if(r.error){fail=true;break}
   if(pend[id]===op)delete pend[id];
  }
  saveLocal();
  if(fail)setSync('warn','Pas synchronisé — gardé sur cet appareil');
  else setSync('ok','Synchronisé sur tous tes appareils');
 })().catch(()=>setSync('warn','Pas synchronisé — gardé sur cet appareil')).finally(()=>{flushing=null});
 return flushing;
}
function put(id,data){items[id]=data;pend[id]='put';saveLocal();render();flush()}
function drop(id){delete items[id];pend[id]='del';saveLocal();render();flush()}
function add(raw){
 const p=parse(raw);if(!p.text)return;
 put(uid(),{text:p.text,urgent:p.urgent,tags:p.tags,done:false,created:Date.now(),doneAt:0});
}

async function load(){
 if(!sb||!signedIn)return;
 setSync('','Synchronisation…');
 await flush();
 const {data,error}=await sb.from('pense_bete').select('*').order('created_at');
 if(error){setSync('warn','Serveur injoignable — gardé sur cet appareil');return}
 const remote={};(data||[]).forEach(r=>{remote[r.id]=fromRow(r)});
 // garde les changements locaux pas encore envoyés
 for(const [id,op] of Object.entries(pend)){if(op==='del')delete remote[id];else if(items[id])remote[id]=items[id]}
 items=remote;saveLocal();
 if(!list.querySelector('.txt input'))render();
 if(!Object.keys(pend).length)setSync('ok','Synchronisé sur tous tes appareils');
}

function ago(ts){
 const s=(Date.now()-ts)/1000;
 if(s<60)return"à l'instant";if(s<3600)return`il y a ${Math.floor(s/60)} min`;
 if(s<86400)return`il y a ${Math.floor(s/3600)} h`;
 const d=Math.floor(s/86400);if(d===1)return'hier';if(d<7)return`il y a ${d} j`;
 return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

function render(){
 const all=Object.entries(items);
 const todo=all.filter(([,v])=>!v.done).length;
 $('#count').textContent=todo?`${todo} chose${todo>1?'s':''} à faire`:"Rien en attente. Note-le avant que ça s'envole.";
 document.title=todo?`(${todo}) Pense-bête`:'Pense-bête';
 const tags=[...new Set(all.flatMap(([,v])=>v.tags||[]))].sort();
 if(tagF&&!tags.includes(tagF))tagF=null;
 chips.replaceChildren(...tags.map(t=>{const b=document.createElement('button');b.className='chip';b.type='button';
  b.textContent='#'+t;b.setAttribute('aria-pressed',tagF===t);b.onclick=()=>{tagF=tagF===t?null:t;render()};return b}));
 const f=find.value.trim().toLowerCase();
 let rows=all.filter(([,v])=>view==='all'||(view==='done')===!!v.done)
  .filter(([,v])=>!tagF||(v.tags||[]).includes(tagF))
  .filter(([,v])=>!f||v.text.toLowerCase().includes(f)||(v.tags||[]).some(t=>t.includes(f)));
 rows.sort(([,a],[,b])=>(a.done-b.done)||(a.done?b.doneAt-a.doneAt:(b.urgent-a.urgent)||(b.created-a.created)));
 if(!rows.length){
  const e=document.createElement('li');e.className='empty';e.style.border='0';e.style.background='none';e.style.display='block';
  const b=document.createElement('b');
  b.textContent=f||tagF?'Rien ne correspond':view==='done'?'Rien de coché pour l’instant':'Tête vide, liste vide';
  e.append(b,f||tagF?'Essaie un autre mot ou retire le filtre.':'Tape une idée en haut et appuie sur Entrée.');
  list.replaceChildren(e);return;
 }
 list.replaceChildren(...rows.map(([id,v])=>row(id,v)));
}
function row(id,v){
 const li=document.createElement('li');li.className=(v.done?'done ':'')+(v.urgent&&!v.done?'hot':'');
 const ck=document.createElement('input');ck.type='checkbox';ck.className='ck';ck.checked=!!v.done;
 ck.setAttribute('aria-label',v.done?'Marquer à faire':'Marquer fait');
 ck.onchange=()=>put(id,{...v,done:ck.checked,doneAt:ck.checked?Date.now():0});
 const body=document.createElement('div');body.className='body';
 const tx=document.createElement('div');tx.className='txt';tx.textContent=v.text;tx.title='Cliquer pour modifier';
 tx.onclick=()=>edit(id,v,tx);
 const meta=document.createElement('div');meta.className='meta';
 (v.tags||[]).forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent='#'+t;meta.append(s)});
 const tm=document.createElement('span');tm.textContent=v.done&&v.doneAt?'fait '+ago(v.doneAt):ago(v.created);meta.append(tm);
 body.append(tx,meta);
 const st=document.createElement('button');st.type='button';st.className='star'+(v.urgent?' on':'');st.textContent='!';
 st.style.fontWeight='700';st.setAttribute('aria-label',v.urgent?'Retirer urgent':'Marquer urgent');
 st.onclick=()=>put(id,{...v,urgent:!v.urgent});
 const del=document.createElement('button');del.type='button';del.className='del';del.textContent='✕';del.setAttribute('aria-label','Supprimer');
 del.onclick=()=>{lastDel=[id,v];drop(id);toast('Supprimé.')};
 li.append(ck,body,st,del);return li;
}
function edit(id,v,tx){
 if(tx.querySelector('input'))return;
 const inp=document.createElement('input');
 inp.value=v.text+(v.tags&&v.tags.length?' '+v.tags.map(t=>'#'+t).join(' '):'');
 tx.replaceChildren(inp);inp.focus();inp.select();
 let doneE=false;
 const finish=save=>{if(doneE)return;doneE=true;
  if(save){const p=parse(inp.value);if(!p.text){lastDel=[id,v];drop(id);toast('Supprimé.');return}
   if(p.text!==v.text||p.tags.join()!==(v.tags||[]).join()){put(id,{...v,text:p.text,tags:p.tags,urgent:v.urgent||p.urgent});return}}
  render()};
 inp.onkeydown=e=>{if(e.key==='Enter')finish(true);if(e.key==='Escape')finish(false)};
 inp.onblur=()=>finish(true);
}
function toast(msg){
 $('#tmsg').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastT);
 toastT=setTimeout(()=>$('#toast').classList.remove('show'),5000);
}
$('#undo').onclick=()=>{if(lastDel){put(lastDel[0],lastDel[1]);lastDel=null}$('#toast').classList.remove('show')};
$('#f').onsubmit=e=>{e.preventDefault();add(q.value);q.value='';q.focus();if(view==='done'){setView('todo')}};
q.onkeydown=e=>{if(e.key==='Escape')q.value=''};
find.oninput=render;
function setView(v){view=v;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('#purge').onclick=()=>{
 const d=Object.entries(items).filter(([,v])=>v.done);if(!d.length){toast('Aucune tâche faite à effacer.');return}
 d.forEach(([id])=>drop(id));lastDel=null;toast(`${d.length} tâche${d.length>1?'s':''} effacée${d.length>1?'s':''}.`);
};
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();q.focus()}
});
setInterval(render,60000);
function setSync(c,t){sync.className=c;sync.textContent=t}

render();q.focus();setSync('','Sauvegardé sur cet appareil');

// Dictée : reconnaissance vocale du navigateur (Chrome Android, Chrome/Edge ordinateur)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 const mic=$('#mic');mic.hidden=false;let rec=null,base='',fin='';
 const stopUI=()=>{mic.classList.remove('on');mic.setAttribute('aria-label','Dicter')};
 mic.onclick=()=>{
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='fr-FR';rec.interimResults=true;rec.continuous=false;
  base=q.value.trim();fin='';
  rec.onresult=e=>{let part='';fin='';for(const r of e.results){if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript}
   q.value=[base,fin,part].join(' ').replace(/\s+/g,' ').trim()};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){mic.hidden=true;toast('Micro refusé : autorise-le dans les réglages du site.')}};
  rec.onend=()=>{rec=null;stopUI();if(fin.trim()&&q.value.trim()){add(q.value);q.value=''}};
  try{rec.start();mic.classList.add('on');mic.setAttribute('aria-label','Arrêter la dictée')}catch(e){rec=null;stopUI()}
 };
}

// Compte et synchronisation (Supabase, même compte que Mes projets)
function showAuth(on){$('#auth').hidden=!on}
if(!window.supabase){setSync('warn','Hors ligne — gardé sur cet appareil')}
else{
 sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 sb.auth.onAuthStateChange((ev,session)=>{
  signedIn=!!session;
  if(session){showAuth(false);if(location.hash.includes('access_token'))history.replaceState(null,'',location.pathname);setTimeout(load,0)}
  else showAuth(true);
 });
 $('#aForm').addEventListener('submit',async e=>{
  e.preventDefault();const email=$('#aMail').value.trim();if(!email)return;
  $('#aBtn').disabled=true;$('#aMsg').textContent='Envoi…';
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
  $('#aBtn').disabled=false;
  $('#aMsg').textContent=error?(/signup|not allowed|not found/i.test(error.message)?'Cette adresse n’a pas accès à l’appli. Demande une invitation.':'Envoi impossible ('+error.message+'). Réessaie dans quelques minutes.'):'Lien envoyé à '+email+'. Ouvre-le sur cet appareil.';
 });
 $('#logout').onclick=async()=>{await sb.auth.signOut();items={};pend={};try{localStorage.removeItem(LS);localStorage.removeItem(LSP)}catch(e){}render();showAuth(true)};

}
