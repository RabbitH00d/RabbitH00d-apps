<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes applis</title>
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#120d0b);--ink:light-dark(#111,#f3ece8);--mute:light-dark(#5b5855,#a99f99);--line:light-dark(#e3dfdb,#3a302b)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:clamp(28px,6vw,64px) 20px}
h1{font:800 clamp(36px,7vw,52px)/1.05 "Sofia Sans Condensed",system-ui,sans-serif;margin:0 0 8px}
p{margin:0 0 28px;color:var(--mute)}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
a{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;border:1px solid var(--line);border-radius:18px;color:inherit;text-decoration:none;text-align:center}
a:hover,a:focus-visible{border-color:var(--ink);outline:none}
img{width:72px;height:72px;border-radius:18px}
b{font-weight:600}small{color:var(--mute);font-size:13px;line-height:1.35}
</style>
</head>
<body>
<main>
  <h1>Mes applis</h1>
  <p>Ouvre une appli, puis « Installer » dans le menu de Chrome pour l’avoir sur l’écran d’accueil avec son icône.</p>
  <ul>
    <li><a href="projets/"><img src="projets/icon-192.png" alt=""><b>Mes projets</b><small>Priorités, rappels, Perso / Asso / Cours</small></a></li>
    <li><a href="decouverte-maker/"><img src="decouverte-maker/icon-192.png" alt=""><b>Découverte maker</b><small>Une découverte par jour</small></a></li>
  </ul>
</main>
</body>
</html>
