<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f45c4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Découverte">
<title>Découverte maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: atelier, direct, une fiche par jour, lisible au pouce.
   IDEA: le tiroir à composants étiqueté — chaque découverte est une étiquette de casier.
   PICTURE: la fiche du jour, grande, en tête, sur un bandeau cobalt comme un casier Raaco.
   COLOUR and TYPE: cobalt dominant, blanc, rouge signal pour l'action ; Barlow Condensed + Barlow.
   LAYOUT: bandeau fiche du jour, puis recherche + filtres, puis la rangée d'étiquettes. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1222);--ink:light-dark(#121826,#eef1f8);--mute:light-dark(#5b6476,#9aa4ba);
--band:light-dark(#1f45c4,#142a78);--bandink:#ffffff;--card:light-dark(#ffffff,#141c31);--line:light-dark(#e3e6ee,#26304a);
--acc:#ff4a1c;--soft:light-dark(#eef2ff,#1a2546)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;line-height:1.05;text-wrap:balance}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px)}
.top{background:var(--band);color:var(--bandink);padding-bottom:clamp(28px,5vw,56px);padding-top:max(clamp(20px,4vw,48px),env(safe-area-inset-top))}
.wrap{max-width:820px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;opacity:.92}
.brand svg{width:26px;height:26px;flex:none}
.brand span:last-child{margin-left:auto;font-weight:500;opacity:.85}
.hero{margin-top:18px;background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);overflow:hidden}
.tab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--soft);font-weight:600;font-size:14px;color:var(--mute)}
.tab b{color:var(--acc)}
.hero .in{padding:18px 18px 20px}
.hero h1{font-size:clamp(32px,7vw,48px)}
.lead{font-size:17px;margin:12px 0 4px}
.sec{margin-top:16px}
.sec h3{font-size:20px;color:var(--band)}
:root[data-theme=dark] .sec h3{color:#8ea8ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .sec h3{color:#8ea8ff}}
.sec p{margin:4px 0 0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{color:inherit;border:1px solid var(--line);border-radius:999px;padding:8px 14px;text-decoration:none;font-weight:500;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
button{font:inherit;cursor:pointer}
.st{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px}
.st[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.fav[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tools{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(5vw,16px)}
.search{width:100%;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,sans-serif;padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;font-size:15px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--band);border-color:var(--band);color:#fff}
.count{color:var(--mute);font-size:14px;margin:14px 0 6px}
.list{list-style:none;margin:0;padding:0}
.row{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card);overflow:hidden}
.row>button{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 14px 10px 10px;min-height:64px}
.day{background:var(--band);color:#fff;border-radius:8px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;line-height:1;padding:8px 0}
.day b{display:block;font-size:24px}.day small{font-size:13px;font-weight:600;opacity:.85}
.t{font-weight:600;font-size:17px;line-height:1.25}
.c{color:var(--mute);font-size:14px}
.mark{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;text-align:right}
.mark .s{color:var(--acc)}
.det{padding:0 14px 16px;border-top:1px solid var(--line)}
.det .acts{margin-top:14px}
.empty{color:var(--mute);padding:28px 0;text-align:center}
.note{font-size:14px;color:var(--mute);margin-top:22px}
.foot{padding-top:4px}
@media(prefers-reduced-motion:no-preference){.hero{animation:up .45s ease-out}@keyframes up{from{transform:translateY(10px);opacity:0}}}
</style>
</head>
<body>
<header class="band top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="3" fill="#fff" opacity=".18"/><rect x="3" y="6" width="26" height="9" rx="3" fill="#fff"/><rect x="11" y="9.5" width="10" height="2.5" rx="1.2" fill="#1f45c4"/><rect x="3" y="17" width="26" height="9" rx="3" fill="#fff" opacity=".55"/><rect x="11" y="20.5" width="10" height="2.5" rx="1.2" fill="#1f45c4"/></svg>
      <span>Découverte maker</span><span id="today"></span>
    </div>
    <article class="hero" id="hero" aria-live="polite">
      <div class="tab"><span>Fiche du jour</span><b id="heroCat"></b></div>
      <div class="in" id="heroBody"><p class="lead">Chargement des tiroirs…</p></div>
    </article>
  </div>
</header>

<div class="tools">
  <div class="wrap">
    <input id="q" class="search" type="search" placeholder="Chercher un composant, une technique…" aria-label="Rechercher">
    <div class="chips" id="chips" role="toolbar" aria-label="Filtres"></div>
  </div>
</div>

<main class="band" style="padding-top:4px">
  <div class="wrap">
    <p class="count" id="count"></p>
    <ul class="list" id="list"></ul>
    <p class="note foot">Une nouvelle fiche arrive chaque matin. Marque ce que tu veux essayer, commander ou ce que tu as déjà testé : c'est enregistré sur cet appareil.</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
